<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Selbstprüfung Touch</title>
<link rel="stylesheet" href="/kiosk.css">
</head>
<body class="page-selftest" data-page="selftest">
<main class="st-board">
<p class="st-text">Selbstprüfung: Alle fünf Felder antippen.</p>
<p class="st-count" id="st-count">0 von 5</p>
<button type="button" class="st-target st-t0" data-target="0">1</button>
<button type="button" class="st-target st-t1" data-target="1">2</button>
<button type="button" class="st-target st-t2" data-target="2">3</button>
<button type="button" class="st-target st-t3" data-target="3">4</button>
<button type="button" class="st-target st-t4" data-target="4">5</button>
</main>
<script src="/selftest.js"></script>
</body>
</html>
