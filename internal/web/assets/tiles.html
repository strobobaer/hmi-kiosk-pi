<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HMI-Auswahl</title>
<link rel="stylesheet" href="/kiosk.css">
</head>
<body class="page-tiles" data-page="tiles" data-osk="{{.OSK}}">
<a class="gear" href="{{.AdminURL}}" aria-label="Einstellungen" title="Einstellungen"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></a>
<div id="hints" class="hints" hidden></div>
<div id="notice" class="notice" role="alert" hidden></div>
<main id="grid" class="grid {{.Layout}}">
{{range .Tiles}}<button type="button" class="tile {{color .Color}}{{if not .Reachable}} muted{{end}}{{if .BusyBy}} busy{{end}}" data-id="{{.ID}}"{{if .Disabled}} disabled{{end}}>
<span class="tile-icon">{{icon .Icon}}</span>
<span class="tile-name">{{.Name}}</span>
{{if .BusyBy}}<span class="tile-sub">belegt durch {{.BusyBy}}</span>{{else if .AuthFailed}}<span class="tile-sub">Passwort falsch</span>{{else if not .Reachable}}<span class="tile-sub">nicht erreichbar</span>{{end}}
</button>
{{end}}</main>
<div id="overlay" class="overlay" hidden>
<div class="panel">
<p id="overlay-text" class="panel-text"></p>
<button type="button" id="overlay-cancel" class="btn secondary">Abbrechen</button>
</div>
</div>
<div id="confirm" class="overlay" hidden>
<div class="panel" role="dialog" aria-modal="true">
<p id="confirm-text" class="panel-text"></p>
<div class="btn-row">
<button type="button" id="confirm-yes" class="btn primary">Übernehmen</button>
<button type="button" id="confirm-no" class="btn secondary">Abbrechen</button>
</div>
</div>
</div>
<script src="/kiosk.js"></script>
<script src="/keyboard.js"></script>
</body>
</html>
