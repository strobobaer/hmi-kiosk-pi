<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sitzungsleiste</title>
<link rel="stylesheet" href="/kiosk.css">
</head>
<body class="page-bar" data-page="bar">
<header class="bar">
<span id="bar-name" class="bar-name">{{.Name}}</span>
<span id="bar-mode" class="badge {{if .Web}}web{{else if .ViewOnly}}view{{else}}operate{{end}}">{{if .Web}}Webseite{{else if .ViewOnly}}Nur ansehen{{else}}Bedienen{{end}}</span>
<span id="bar-notice" class="bar-notice"{{if not .Warned}} hidden{{end}}>{{if .Warned}}{{.Notice}}{{end}}</span>
<button type="button" class="bar-osk" data-osk-toggle aria-label="Bildschirmtastatur ein- oder ausblenden">Tastatur</button>
<button type="button" id="bar-back" class="bar-back">Zurück</button>
</header>
<script src="/kiosk.js"></script>
<script src="/keyboard.js"></script>
</body>
</html>
