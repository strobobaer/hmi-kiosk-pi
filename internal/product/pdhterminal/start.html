<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{{if .Refresh}}<meta http-equiv="refresh" content="{{.Refresh}}">{{end}}
<title>PDH-Terminal</title>
<style>
html,body{margin:0;height:100%;background:#111;color:#fff;font-family:sans-serif}
body{display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box}
p{font-size:40px;line-height:1.3;max-width:900px;margin:0}
button{font-size:40px;padding:24px 48px;margin-top:32px;min-height:96px;border:0;border-radius:12px;background:#2d7dd2;color:#fff}
</style></head><body>
{{if .Form}}<form method="post" action="{{.Action}}">
<input type="hidden" name="secret" value="{{.Secret}}">
<p>Anmeldung bei PDH …</p>
<button type="submit">Anmelden</button>
</form>
<script>document.forms[0].submit();</script>
{{else}}<p>{{.Message}}</p>{{end}}
</body></html>
