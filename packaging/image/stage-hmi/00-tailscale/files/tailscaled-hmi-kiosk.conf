# Installiert als /etc/systemd/system/tailscaled.service.d/hmi-kiosk.conf (00-tailscale/00-run.sh).
# Der Zustand von tailscaled (Anmeldung, Knotenschlüssel) liegt auf der Datenpartition, weil / im Betrieb unter einem
# RAM-Overlay liegt; sonst wäre das Gerät nach jedem Neustart vom Tailnet abgemeldet.
# hmi-kiosk-tailscale-state legt /data/system/tailscale (root, 0700) an, prüft es und verwirft den Zustand auf einem
# anderen Gerät (geklonte Karte); misslingt die Prüfung, startet tailscaled nicht. „+“: ohne den Namensraum des
# Dienstes, der Ordner muss vor dem Einbinden da sein.
# BindPaths= bindet den geprüften Ordner auf /var/lib/tailscale ein; ExecStart und --state des Pakets
# (/var/lib/tailscale/tailscaled.state, PORT und FLAGS aus /etc/default/tailscaled) bleiben unverändert. Das Einbinden
# hält den Ordner fest: Ein späterer Tausch von /data/system wirkt auf den laufenden tailscaled nicht.
[Unit]
RequiresMountsFor=/data
After=hmi-kiosk-firstboot.service hmi-kiosk-grow-data.service

[Service]
ExecStartPre=+/usr/local/sbin/hmi-kiosk-tailscale-state
BindPaths=/data/system/tailscale:/var/lib/tailscale
