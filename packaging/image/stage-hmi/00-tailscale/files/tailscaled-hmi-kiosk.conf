# Installiert als /etc/systemd/system/tailscaled.service.d/hmi-kiosk.conf (00-tailscale/00-run.sh).
# Der Zustand von tailscaled (Anmeldung, Knotenschlüssel) liegt auf der Datenpartition, weil / im Betrieb
# unter einem RAM-Overlay liegt; sonst wäre das Gerät nach jedem Neustart vom Tailnet abgemeldet.
# hmi-kiosk-tailscale-state legt /data/system/tailscale (root, 0700) an und prüft es; misslingt das,
# startet tailscaled nicht.
[Unit]
RequiresMountsFor=/data
After=hmi-kiosk-firstboot.service hmi-kiosk-grow-data.service

[Service]
ExecStartPre=/usr/local/sbin/hmi-kiosk-tailscale-state
# Wie die Unit des Pakets (EnvironmentFile=/etc/default/tailscaled mit PORT und FLAGS), nur mit dem
# Zustand auf /data. Die leere Zeile hebt das ExecStart= des Pakets auf.
ExecStart=
ExecStart=/usr/sbin/tailscaled --state=/data/system/tailscale/tailscaled.state --statedir=/data/system/tailscale --socket=/run/tailscale/tailscaled.sock --port=${PORT} $FLAGS
